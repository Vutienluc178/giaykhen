<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tạo Giấy Khen Học Sinh</title>
  
  <!-- Tải Tailwind CSS để giữ nguyên giao diện -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Tải React và ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Tải Babel để biên dịch mã JSX ngay trên trình duyệt -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Tải JSZip để hỗ trợ nén file hàng loạt -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  
  <!-- Tải SheetJS (xlsx) để đọc file Excel -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body class="bg-gray-100">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- Inline SVG Icons ---
    const Download = ({ className }) => (<svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>);
    const Award = ({ className }) => (<svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></svg>);
    const User = ({ className }) => (<svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>);
    const GraduationCap = ({ className }) => (<svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21.42 10.922a2 2 0 0 0-.019-3.838L12.83 4.3a2 2 0 0 0-1.66 0L2.6 7.08a2 2 0 0 0 0 3.832l8.57 3.908a2 2 0 0 0 1.66 0z"/><path d="M22 10v6"/><path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"/></svg>);
    const ImageIcon = ({ className }) => (<svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>);
    const LayoutTemplate = ({ className }) => (<svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="18" height="7" x="3" y="3" rx="1"/><rect width="9" height="7" x="3" y="14" rx="1"/><rect width="5" height="7" x="16" y="14" rx="1"/></svg>);
    const Trophy = ({ className }) => (<svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>);
    const Users = ({ className }) => (<svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>);
    const FileArchive = ({ className }) => (<svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 22h14a2 2 0 0 0 2-2V7.5L14.5 2H6a2 2 0 0 0-2 2v4"/><polyline points="14 2 14 8 20 8"/><path d="M10 12v10"/><path d="M10 12H7"/><path d="M10 15H7"/><path d="M10 18H7"/><path d="M10 21H7"/></svg>);
    const Loader2 = ({ className }) => (<svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>);
    const FileSpreadsheet = ({ className }) => (<svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><path d="M8 13h2"/><path d="M8 17h2"/><path d="M14 13h2"/><path d="M14 17h2"/></svg>);

    const THEMES = {
      classic: { id: 'classic', name: 'Cổ Điển', bg: '#fdfbf7', outer: '#d4af37', inner: '#0f2b5b', textMain: '#0f2b5b', textHighlight: '#c1121f', textNormal: '#333' },
      traditional: { id: 'traditional', name: 'Truyền Thống', bg: '#fffdf0', outer: '#c1121f', inner: '#d4af37', textMain: '#c1121f', textHighlight: '#c1121f', textNormal: '#111' },
      modern: { id: 'modern', name: 'Hiện Đại', bg: '#ffffff', outer: '#0ea5e9', inner: '#0369a1', textMain: '#0369a1', textHighlight: '#0ea5e9', textNormal: '#334155' },
      elegant: { id: 'elegant', name: 'Sang Trọng', bg: '#f8f9fa', outer: '#14532d', inner: '#d4af37', textMain: '#14532d', textHighlight: '#b91c1c', textNormal: '#1f2937' },
      minimal: { id: 'minimal', name: 'Tối Giản', bg: '#ffffff', outer: '#111827', inner: '#e5e7eb', textMain: '#111827', textHighlight: '#111827', textNormal: '#4b5563' },
      blank: { id: 'blank', name: 'Nền Trống (Chỉ Chữ)', bg: '#ffffff', outer: 'transparent', inner: 'transparent', textMain: '#111827', textHighlight: '#b91c1c', textNormal: '#1f2937' },
      genz_neon: { id: 'genz_neon', name: 'Neon Cyber', bg: '#0f172a', outer: '#06b6d4', inner: '#d946ef', textMain: '#22d3ee', textHighlight: '#e879f9', textNormal: '#f8fafc' },
      genz_pastel: { id: 'genz_pastel', name: 'Pastel Vibe', bg: '#fdf4ff', outer: '#fbcfe8', inner: '#bfdbfe', textMain: '#db2777', textHighlight: '#9333ea', textNormal: '#4b5563' },
      genz_y2k: { id: 'genz_y2k', name: 'Y2K Style', bg: '#fef08a', outer: '#c026d3', inner: '#3b82f6', textMain: '#c026d3', textHighlight: '#ea580c', textNormal: '#1e3a8a' },
      kids_animals: { id: 'kids_animals', name: 'Động Vật Nhí', bg: '#f0fdf4', outer: '#22c55e', inner: '#f97316', textMain: '#15803d', textHighlight: '#c2410c', textNormal: '#166534' },
      kids_space: { id: 'kids_space', name: 'Phi Hành Gia', bg: '#1e1b4b', outer: '#8b5cf6', inner: '#fbbf24', textMain: '#fbbf24', textHighlight: '#38bdf8', textNormal: '#e0e7ff' },
      kids_rainbow: { id: 'kids_rainbow', name: 'Mây Cầu Vồng', bg: '#ffffff', outer: '#ef4444', inner: '#3b82f6', textMain: '#be185d', textHighlight: '#ea580c', textNormal: '#4338ca' },
      kids_ocean: { id: 'kids_ocean', name: 'Đại Dương Xanh', bg: '#ecfeff', outer: '#06b6d4', inner: '#0369a1', textMain: '#0c4a6e', textHighlight: '#0284c7', textNormal: '#164e63' },
      kids_candy: { id: 'kids_candy', name: 'Kẹo Ngọt', bg: '#fdf4ff', outer: '#f472b6', inner: '#fcd34d', textMain: '#be185d', textHighlight: '#f43f5e', textNormal: '#831843' }
    };

    // Hàm render chính được tách rời để phục vụ vẽ ẩn (off-screen) cho ảnh hàng loạt
    const renderCertificate = (canvas, config) => {
      const ctx = canvas.getContext('2d');
      const W = 2246; const H = 1588;
      canvas.width = W; canvas.height = H;
      const { 
        theme, schoolName, className, period, studentName, 
        teacherName, teacherTitle, awardPrefix, reason, 
        photoImg, bgImg, decoration, laurelStyle 
      } = config;

      // Các Helper functions
      const drawTextFit = (ctx, txt, x, y, baseSize, fontName, color, align, maxWidth, styleWeight = '') => {
        let size = baseSize;
        ctx.font = `${styleWeight} ${size}px "${fontName}", serif`.trim();
        while (ctx.measureText(txt).width > maxWidth && size > 20) {
          size -= 2;
          ctx.font = `${styleWeight} ${size}px "${fontName}", serif`.trim();
        }
        ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillText(txt, x, y);
        return size; 
      };

      const wrapTextFit = (context, text, x, y, maxWidth, baseLineHeight, baseSize, fontName, color, styleWeight = '') => {
        context.fillStyle = color; context.textAlign = 'left'; context.textBaseline = 'middle';
        let size = baseSize; context.font = `${styleWeight} ${size}px "${fontName}", serif`.trim();
        const words = text.split(' '); let line = ''; let currentY = y;
        for (let n = 0; n < words.length; n++) {
          const testLine = line + words[n] + ' ';
          const metrics = context.measureText(testLine);
          if (metrics.width > maxWidth && n > 0) {
            context.fillText(line, x, currentY); line = words[n] + ' '; currentY += baseLineHeight;
          } else { line = testLine; }
        }
        context.fillText(line, x, currentY);
      };

      // 1. Vẽ Nền
      if (bgImg) {
        ctx.drawImage(bgImg, 0, 0, W, H);
      } else {
        ctx.fillStyle = theme.bg;
        ctx.fillRect(0, 0, W, H);
      }

      // 2. Khung Viền
      const drawBorders = () => {
        if (theme.outer === 'transparent' || bgImg) return; // Tự động ẩn khung viền giấy khen khi có phôi nền

        ctx.lineWidth = 20; ctx.strokeStyle = theme.outer; ctx.strokeRect(40, 40, W - 80, H - 80);
        ctx.lineWidth = 4; ctx.strokeStyle = theme.inner; ctx.strokeRect(80, 80, W - 160, H - 160);

        if (theme.id === 'classic' || theme.id === 'elegant') {
          const drawCorner = (x, y, rot) => {
            ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.fillStyle = theme.inner;
            ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(120, 0); ctx.lineTo(0, 120); ctx.fill(); ctx.restore();
          };
          drawCorner(40, 40, 0); drawCorner(W - 40, 40, Math.PI / 2); drawCorner(W - 40, H - 40, Math.PI); drawCorner(40, H - 40, -Math.PI / 2);
        } else if (theme.id === 'traditional') {
          const drawCircle = (x, y) => { ctx.beginPath(); ctx.arc(x, y, 30, 0, Math.PI * 2); ctx.fillStyle = theme.inner; ctx.fill(); };
          drawCircle(80, 80); drawCircle(W - 80, 80); drawCircle(W - 80, H - 80); drawCircle(80, H - 80);
        } else if (theme.id === 'modern') {
           const drawPoly = (x, y, x2, y2, x3, y3) => { ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x2,y2); ctx.lineTo(x3,y3); ctx.closePath(); ctx.fillStyle = theme.outer; ctx.fill(); }
           drawPoly(40,40, 200,40, 40,200); drawPoly(W-40,40, W-200,40, W-40,200); drawPoly(W-40,H-40, W-200,H-40, W-40,H-200); drawPoly(40,H-40, 200,H-40, 40,H-200);
        } else if (theme.id === 'genz_neon') {
          const drawCyberCorner = (x, y, isRight, isBottom) => {
            ctx.beginPath(); ctx.moveTo(x + (isRight ? -100 : 100), y); ctx.lineTo(x, y); ctx.lineTo(x, y + (isBottom ? -100 : 100));
            ctx.lineWidth = 15; ctx.strokeStyle = theme.textHighlight; ctx.stroke();
          };
          drawCyberCorner(40, 40, false, false); drawCyberCorner(W - 40, 40, true, false); drawCyberCorner(40, H - 40, false, true); drawCyberCorner(W - 40, H - 40, true, true);
        } else if (theme.id === 'genz_pastel') {
          const drawDot = (x, y) => { ctx.beginPath(); ctx.arc(x, y, 40, 0, Math.PI * 2); ctx.fillStyle = theme.textHighlight; ctx.fill(); };
          drawDot(80, 80); drawDot(W - 80, 80); drawDot(W - 80, H - 80); drawDot(80, H - 80);
        } else if (theme.id === 'genz_y2k') {
          ctx.lineWidth = 10; ctx.strokeStyle = theme.inner; ctx.strokeRect(60, 60, W - 120, H - 120);
          ctx.fillStyle = theme.textHighlight; ctx.fillRect(40, 40, 50, 50); ctx.fillRect(W - 90, 40, 50, 50); ctx.fillRect(40, H - 90, 50, 50); ctx.fillRect(W - 90, H - 90, 50, 50);
        } else if (theme.id === 'kids_animals') {
          const drawPaw = (x, y) => {
              ctx.fillStyle = theme.inner; ctx.beginPath(); ctx.arc(x, y, 20, 0, Math.PI*2); ctx.fill();
              ctx.beginPath(); ctx.arc(x-25, y-20, 12, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(x, y-30, 15, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(x+25, y-20, 12, 0, Math.PI*2); ctx.fill();
          }
          drawPaw(80, 80); drawPaw(W-80, 80); drawPaw(W-80, H-80); drawPaw(80, H-80);
        } else if (theme.id === 'kids_space') {
          const drawStar = (cx, cy, spikes, outerRadius, innerRadius) => {
              let rot = Math.PI / 2 * 3; let x = cx; let y = cy; let step = Math.PI / spikes;
              ctx.beginPath(); ctx.moveTo(cx, cy - outerRadius);
              for(let i=0; i<spikes; i++){
                  x = cx + Math.cos(rot)*outerRadius; y = cy + Math.sin(rot)*outerRadius; ctx.lineTo(x,y); rot+=step;
                  x = cx + Math.cos(rot)*innerRadius; y = cy + Math.sin(rot)*innerRadius; ctx.lineTo(x,y); rot+=step;
              }
              ctx.lineTo(cx, cy - outerRadius); ctx.closePath(); ctx.fillStyle = theme.inner; ctx.fill();
          }
          drawStar(100, 100, 5, 40, 15); drawStar(W-100, 100, 5, 40, 15); drawStar(W-100, H-100, 5, 40, 15); drawStar(100, H-100, 5, 40, 15);
        } else if (theme.id === 'kids_rainbow') {
          const drawCloud = (x, y) => {
              ctx.fillStyle = '#bae6fd'; ctx.beginPath(); ctx.arc(x, y, 30, Math.PI*0.5, Math.PI*1.5); ctx.arc(x+25, y-20, 35, Math.PI*1, Math.PI*2);
              ctx.arc(x+60, y-10, 30, Math.PI*1.2, Math.PI*2); ctx.arc(x+80, y+10, 20, Math.PI*1.5, Math.PI*0.5); ctx.moveTo(x+80, y+30); ctx.lineTo(x, y+30); ctx.fill();
          }
          drawCloud(50, 60); drawCloud(W-150, 60); drawCloud(W-150, H-100); drawCloud(50, H-100);
        } else if (theme.id === 'kids_ocean') {
          const drawBubble = (x, y, r) => {
              ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fillStyle = 'rgba(255, 255, 255, 0.4)'; ctx.fill();
              ctx.lineWidth = 2; ctx.strokeStyle = theme.inner; ctx.stroke(); ctx.beginPath(); ctx.arc(x - r*0.3, y - r*0.3, r*0.2, 0, Math.PI*2); ctx.fillStyle = 'rgba(255, 255, 255, 0.8)'; ctx.fill();
          }
          drawBubble(100, 100, 40); drawBubble(60, 150, 20); drawBubble(150, 60, 25); drawBubble(W-100, 100, 40); drawBubble(W-60, 150, 20); drawBubble(W-150, 60, 25);
          drawBubble(W-100, H-100, 40); drawBubble(W-60, H-150, 20); drawBubble(W-150, H-60, 25); drawBubble(100, H-100, 40); drawBubble(60, H-150, 20); drawBubble(150, H-60, 25);
        } else if (theme.id === 'kids_candy') {
          const drawCandy = (x, y) => {
              ctx.save(); ctx.translate(x, y); ctx.rotate(Math.PI/4); ctx.fillStyle = theme.outer;
              ctx.beginPath(); ctx.moveTo(-30, 0); ctx.lineTo(-60, -20); ctx.lineTo(-60, 20); ctx.fill();
              ctx.beginPath(); ctx.moveTo(30, 0); ctx.lineTo(60, -20); ctx.lineTo(60, 20); ctx.fill();
              ctx.beginPath(); ctx.arc(0, 0, 35, 0, Math.PI*2); ctx.fillStyle = theme.inner; ctx.fill();
              ctx.beginPath(); ctx.arc(0, 0, 25, 0, Math.PI*2); ctx.fillStyle = '#ffffff'; ctx.fill();
              ctx.beginPath(); ctx.arc(0, 0, 15, 0, Math.PI); ctx.lineWidth = 5; ctx.strokeStyle = theme.outer; ctx.stroke();
              ctx.restore();
          }
          drawCandy(100, 100); drawCandy(W-100, 100); drawCandy(W-100, H-100); drawCandy(100, H-100);
        }
      };
      drawBorders();

      // 3. Header
      if (theme.id !== 'blank' || schoolName !== 'TRƯỜNG THPT NGUYỄN HỮU CẢNH') {
          drawTextFit(ctx, schoolName.toUpperCase(), 450, 160, 40, 'Times New Roman', theme.textMain, 'center', 750, 'bold');
          if(theme.id !== 'blank') { ctx.fillStyle = theme.textMain; ctx.fillRect(300, 195, 300, 3); }
      }
      
      if (theme.id !== 'blank') {
          drawTextFit(ctx, 'CỘNG HÒA XÃ HỘI CHỦ NGHĨA VIỆT NAM', W - 500, 150, 45, 'Times New Roman', theme.textNormal, 'center', 800, 'bold');
          drawTextFit(ctx, 'Độc lập - Tự do - Hạnh phúc', W - 500, 210, 40, 'Times New Roman', theme.textNormal, 'center', 800, 'bold');
          ctx.fillStyle = theme.textNormal; ctx.fillRect(W - 680, 245, 360, 3);
          
          // 4. Title
          drawTextFit(ctx, 'GIẤY KHEN', W / 2, 400, 140, 'Times New Roman', theme.textHighlight, 'center', 1000, 'bold');
          drawTextFit(ctx, 'HỌC SINH TIÊU BIỂU', W / 2, 530, 60, 'Times New Roman', theme.inner, 'center', 800, 'italic bold');
      }

      // 5. Ảnh Thẻ Học Sinh & Vòng Nguyệt Quế
      const cx = 500; const cy = 900; const r = 240;

      if (photoImg) {
        ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.clip();
        const imgAspect = photoImg.width / photoImg.height;
        let dw = r * 2; let dh = r * 2;
        if (imgAspect > 1) { dw = dh * imgAspect; } else { dh = dw / imgAspect; }
        ctx.drawImage(photoImg, cx - dw / 2, cy - dh / 2, dw, dh);
        ctx.restore();
      } else if (theme.id !== 'blank' && !bgImg) {
        ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fillStyle = '#f3f4f6'; ctx.fill();
        ctx.font = '40px Arial'; ctx.fillStyle = '#9ca3af'; ctx.textAlign = 'center'; ctx.fillText('Ảnh thẻ', cx, cy);
        ctx.restore();
      }

      if (!bgImg && (theme.id !== 'blank' || photoImg)) {
          ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.lineWidth = 16; ctx.strokeStyle = theme.inner === 'transparent' ? '#d4af37' : theme.inner; ctx.stroke();
          ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.lineWidth = 4; ctx.strokeStyle = theme.outer === 'transparent' ? '#0f2b5b' : theme.outer; ctx.stroke();
      }

      // Vẽ Vòng Nguyệt Quế
      if (laurelStyle !== 'none') {
        const drawLaurel = (ctx, x, y, radius, style) => {
          ctx.save(); ctx.translate(x, y);
          const branchR = radius + 35;
          const drawBranches = (color, width) => {
            ctx.strokeStyle = color; ctx.lineWidth = width; ctx.lineCap = 'round';
            ctx.beginPath(); ctx.arc(0, 0, branchR, Math.PI * 0.55, Math.PI * 1.1); ctx.stroke();
            ctx.beginPath(); ctx.arc(0, 0, branchR, -Math.PI * 0.1, Math.PI * 0.45); ctx.stroke();
          };
          const placeAlongArc = (step, callback) => {
            let i = 0;
            for(let angle = 0.6; angle <= 1.1; angle += step) {
              ctx.save(); ctx.translate(Math.cos(Math.PI*angle)*branchR, Math.sin(Math.PI*angle)*branchR); ctx.rotate(Math.PI*angle + Math.PI/3); callback(i++, true); ctx.restore();
            }
            let j = 0;
            for(let angle = -0.1; angle <= 0.4; angle += step) {
              ctx.save(); ctx.translate(Math.cos(Math.PI*angle)*branchR, Math.sin(Math.PI*angle)*branchR); ctx.rotate(Math.PI*angle - Math.PI/3); callback(j++, false); ctx.restore();
            }
          };
          const drawRibbon = (mainColor, shadowColor) => {
            ctx.shadowColor = 'transparent'; ctx.fillStyle = shadowColor;
            ctx.beginPath(); ctx.moveTo(0, branchR); ctx.lineTo(-30, branchR + 55); ctx.lineTo(-10, branchR + 55); ctx.lineTo(0, branchR + 20); ctx.lineTo(10, branchR + 55); ctx.lineTo(30, branchR + 55); ctx.closePath(); ctx.fill();
            ctx.fillStyle = mainColor; ctx.beginPath(); ctx.arc(0, branchR, 12, 0, Math.PI*2); ctx.fill();
          };

          ctx.shadowColor = 'rgba(0,0,0,0.2)'; ctx.shadowBlur = 4; ctx.shadowOffsetY = 2;

          if (style === 'classic_gold') {
            drawBranches('#ca8a04', 8);
            placeAlongArc(0.06, () => {
              ctx.beginPath(); ctx.ellipse(0, 0, 18, 9, 0, 0, Math.PI*2);
              ctx.fillStyle = '#eab308'; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = '#a16207'; ctx.stroke();
            });
            drawRibbon('#dc2626', '#991b1b');
          } else if (style === 'royal_emerald') {
            drawBranches('#78350f', 6);
            placeAlongArc(0.05, (i) => {
              ctx.beginPath(); ctx.ellipse(0, 0, 16, 8, 0, 0, Math.PI*2);
              ctx.fillStyle = '#166534'; ctx.fill(); ctx.lineWidth = 1.5; ctx.strokeStyle = '#4ade80'; ctx.stroke();

              let cls = row[1] || '';

                  cls = row[2] || '';
                  rsn = row[3] || '';

          link.href = url;
          document.body.appendChild(link); link.click(); document.body.removeChild(link);
        } else {
          setIsGenerating(true);
          try {
            const zip = new window.JSZip();
            const offscreenCanvas = document.createElement('canvas');
            const globalReason = reason === 'Khác' ? customReason : reason;
            let studentsToProcess = [];

            if (batchInputType === 'text') {
                if (!studentList.trim()) throw new Error("Vui lòng nhập danh sách học sinh!");
                const lines = studentList.split('\n').filter(l => l.trim() !== '');
                studentsToProcess = lines.map(line => {
                    const parts = line.split('|').map(p => p.trim());
                    return { name: parts[0] || '', className: parts[1] || className, reason: parts[2] || globalReason };
                }).filter(s => s.name);
            } else if (batchInputType === 'excel') {
                if (Object.keys(excelData).length === 0) throw new Error("Vui lòng tải lên file Excel!");
                if (selectedExcelClass === 'ALL') {
                    Object.values(excelData).forEach(arr => studentsToProcess.push(...arr));
                } else if (excelData[selectedExcelClass]) {
                    studentsToProcess = [...excelData[selectedExcelClass]];
                }
            }

            if (studentsToProcess.length === 0) throw new Error("Không có dữ liệu học sinh để tạo hàng loạt!");

            for (let i = 0; i < studentsToProcess.length; i++) {
              const s = studentsToProcess[i];
              const sReason = s.reason || globalReason;
              const sClass = s.className || className;

              renderCertificate(offscreenCanvas, {
                 theme: THEMES[selectedTheme],
                 schoolName,
                 className: sClass,
                 period,
                 studentName: s.name,
                 teacherTitle,
                 teacherName,
                 awardPrefix,
                 reason: sReason,
                 photoImg, 
                 bgImg,
                 decoration,
                 laurelStyle
              });

              const dataUrl = offscreenCanvas.toDataURL('image/png');
              const base64Data = dataUrl.replace(/^data:image\/(png|jpg);base64,/, "");
              // Cấu trúc thư mục zip theo tên lớp
              zip.file(`${sClass}/Giay_Khen_${s.name.replace(/\s+/g, '_')}.png`, base64Data, {base64: true});
            }

            const content = await zip.generateAsync({type: "blob"});
            const link = document.createElement('a');
            link.href = URL.createObjectURL(content);
            link.download = `Danh_Sach_Giay_Khen_Hang_Loat.zip`;
            document.body.appendChild(link); link.click(); document.body.removeChild(link);
          } catch (error) {
            console.error(error);
            alert(error.message || "Có lỗi xảy ra trong quá trình nén file!");
          }
          setIsGenerating(false);
        }
      };

      return (
        <div className="min-h-screen bg-gray-100 p-4 md:p-8 font-sans">
          <div className="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            {/* PANEL TRÁI */}
            <div className="lg:col-span-4 bg-white rounded-2xl shadow-xl p-6 h-fit border border-gray-100">
              <div className="flex items-center space-x-3 mb-6 border-b pb-4">
                <Award className="w-8 h-8 text-yellow-600" />
                <h1 className="text-2xl font-bold text-gray-800">Tạo Giấy Khen</h1>
              </div>

              {/* TABS: Chế độ nhập */}
              <div className="flex bg-gray-100 p-1 rounded-lg mb-6 shadow-inner">
                <button onClick={() => setInputMode('single')} className={`flex items-center justify-center space-x-2 flex-1 py-2.5 text-sm font-medium rounded-md transition-all ${inputMode === 'single' ? 'bg-white shadow text-blue-600' : 'text-gray-500 hover:text-gray-700'}`}>
                  <User className="w-4 h-4" />
                  <span>Tạo 1 tờ</span>
                </button>
                <button onClick={() => setInputMode('batch')} className={`flex items-center justify-center space-x-2 flex-1 py-2.5 text-sm font-medium rounded-md transition-all ${inputMode === 'batch' ? 'bg-white shadow text-blue-600' : 'text-gray-500 hover:text-gray-700'}`}>
                  <Users className="w-4 h-4" />
                  <span>Tạo Hàng Loạt</span>
                </button>
              </div>

              <div className="space-y-4">
                
                {/* Upload Dữ Liệu Excel */}
                <div className="bg-green-50 p-4 rounded-xl border border-green-200">
                  <label className="flex items-center justify-between text-sm font-bold text-green-800 mb-2">
                    <div className="flex items-center space-x-2">
                        <FileSpreadsheet className="w-5 h-5" />
                        <span>Danh sách Học sinh (Excel)</span>
                    </div>
                  </label>
                  <input type="file" accept=".xlsx, .xls" onChange={handleExcelUpload} className="w-full text-sm text-gray-700 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-green-100 file:text-green-700 hover:file:bg-green-200 cursor-pointer" />
                  {Object.keys(excelData).length > 0 && (
                    <div className="mt-2 text-xs text-green-700 font-medium">
                        ✓ Đã tải: {Object.keys(excelData).length} lớp, {Object.values(excelData).flat().length} học sinh.
                    </div>
                  )}
                  <p className="text-xs text-green-600 mt-1">Cột khuyên dùng: Tên | Lớp | Lý do (Không bắt buộc)</p>
                </div>

                <div className="border-t pt-4 border-gray-100"></div>

                {/* Upload Phôi Nền */}
                <div>
                  <label className="block text-sm font-medium text-gray-700 mb-1">Ảnh Nền / Phôi Giấy Khen (Tùy chọn)</label>
                  <label className="flex items-center justify-center w-full px-4 py-3 border-2 border-dashed border-gray-300 rounded-xl cursor-pointer hover:bg-gray-50 hover:border-blue-400 transition-colors group">
                    <div className="flex items-center space-x-2">
                      <ImageIcon className="w-5 h-5 text-gray-400 group-hover:text-blue-500" />
                      <span className="text-sm text-gray-500 group-hover:text-blue-600 truncate">
                        {bgUrl ? 'Đã tải phôi nền (Nhấn đổi ảnh)' : 'Tải lên phôi chuẩn A4 ngang'}
                      </span>
                    </div>
                    <input type="file" className="hidden" accept="image/*" onChange={handleBgUpload} />
                  </label>
                  {bgUrl && (
                    <button onClick={() => { setBgUrl(null); setBgImg(null); }} className="text-xs text-red-500 mt-1 hover:underline ml-1">
                      Xóa phôi nền tải lên
                    </button>
                  )}
                </div>

                <div>
                  <label className="flex items-center space-x-2 text-sm font-medium text-gray-700 mb-2">
                    <LayoutTemplate className="w-4 h-4" />
                    <span>Chọn Mẫu Giấy Khen</span>
                  </label>
                  <div className="grid grid-cols-2 md:grid-cols-3 gap-2">
                    {Object.values(THEMES).map((t) => (
                      <button key={t.id} onClick={() => setSelectedTheme(t.id)}
                        className={`px-2 py-2 text-sm rounded-lg border-2 font-medium transition-all truncate ${selectedTheme === t.id ? 'border-blue-500 bg-blue-50 text-blue-700' : 'border-gray-200 bg-white text-gray-600 hover:border-blue-300'}`}>
                        {t.name}
                      </button>
                    ))}
                  </div>
                </div>

                <div className="border-t pt-4 border-gray-100"></div>

                <div>
                  <label className="block text-sm font-medium text-gray-700 mb-1">Tên Trường</label>
                  <input type="text" value={schoolName} onChange={(e) => setSchoolName(e.target.value)} className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Nhập tên trường..." />
                </div>

                <div className="grid grid-cols-2 gap-4">
                  <div>
                    <label className="block text-sm font-medium text-gray-700 mb-1">Lớp {inputMode === 'batch' && '(Mặc định)'}</label>
                    <input type="text" value={className} onChange={(e) => setClassName(e.target.value)} className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="VD: 10A1" />
                  </div>
                  <div>
                    <label className="block text-sm font-medium text-gray-700 mb-1">Thời gian</label>
                    <input type="text" value={period} onChange={(e) => setPeriod(e.target.value)} className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="VD: Tuần 10" />
                  </div>
                </div>

                <div className="grid grid-cols-2 gap-4">
                    <div>
                        <label className="block text-sm font-medium text-gray-700 mb-1">Chức danh người ký</label>
                        <input type="text" value={teacherTitle} onChange={(e) => setTeacherTitle(e.target.value)} className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="VD: GIÁO VIÊN BỘ MÔN" />
                    </div>
                    <div>
                        <label className="block text-sm font-medium text-gray-700 mb-1">Tên người ký</label>
                        <input type="text" value={teacherName} onChange={(e) => setTeacherName(e.target.value)} className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Tên sẽ thành chữ ký..." />
                    </div>
                </div>

                <div className="border-t pt-4 border-gray-100"></div>

                {inputMode === 'single' ? (
                  <>
                    <div className="bg-blue-50 p-4 rounded-xl border border-blue-100">
                        <label className="block text-sm font-medium text-gray-700 mb-2">Thông tin học sinh</label>
                        <div className="flex space-x-2 mb-3 bg-white p-1 rounded-lg border border-blue-200">
                            <button onClick={() => setNameInputType('manual')} className={`flex-1 py-1.5 text-sm font-medium rounded transition-all ${nameInputType === 'manual' ? 'bg-blue-100 text-blue-700' : 'text-gray-500 hover:bg-gray-50'}`}>Nhập tay</button>
                            <button onClick={() => setNameInputType('excel')} disabled={Object.keys(excelData).length === 0} className={`flex-1 py-1.5 text-sm font-medium rounded transition-all ${nameInputType === 'excel' ? 'bg-blue-100 text-blue-700' : 'text-gray-500 hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed'}`}>Chọn từ Excel</button>
                        </div>

                        {nameInputType === 'manual' ? (
                            <input type="text" value={studentName} onChange={(e) => setStudentName(e.target.value)} className="w-full px-4 py-2 mb-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Nhập tên học sinh..." />
                        ) : (
                            <div className="space-y-2 mb-2">
                                <select value={selectedExcelClass} onChange={(e) => setSelectedExcelClass(e.target.value)} className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                                    {Object.keys(excelData).map(cls => <option key={cls} value={cls}>Lớp: {cls}</option>)}
                                </select>
                                <select onChange={(e) => {
                                    const st = excelData[selectedExcelClass][e.target.value];
                                    setStudentName(st.name); setClassName(st.className);
                                    if(st.reason) { setReason('Khác'); setCustomReason(st.reason); }
                                }} className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                                    <option value="">-- Chọn tên học sinh --</option>
                                    {excelData[selectedExcelClass]?.map((s, idx) => <option key={idx} value={idx}>{s.name}</option>)}
                                </select>
                            </div>
                        )}

                        <div className="mt-3">
                            <label className="block text-xs font-medium text-gray-700 mb-1">Dòng khen thưởng</label>
                            <div className="flex space-x-2 mb-2">
                                <input type="text" value={awardPrefix} onChange={(e) => setAwardPrefix(e.target.value)} className="w-1/3 px-3 py-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Khen tặng em:" />
                                <select value={reason} onChange={(e) => setReason(e.target.value)} className="w-2/3 px-3 py-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                                    {predefinedReasons.map((r, i) => <option key={i} value={r}>{r}</option>)}
                                </select>
                            </div>
                            {reason === 'Khác' && (
                                <textarea value={customReason} onChange={(e) => setCustomReason(e.target.value)} className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none resize-none" placeholder="Nhập lý do cụ thể..." rows="2" />
                            )}
                        </div>
                    </div>
                  </>
                ) : (
                  <div className="bg-blue-50 p-4 rounded-xl border border-blue-100">
                    <label className="block text-sm font-medium text-gray-700 mb-2">Danh sách khen thưởng hàng loạt</label>
                    <div className="flex space-x-2 mb-3 bg-white p-1 rounded-lg border border-blue-200">
                        <button onClick={() => setBatchInputType('text')} className={`flex-1 py-1.5 text-sm font-medium rounded transition-all ${batchInputType === 'text' ? 'bg-blue-100 text-blue-700' : 'text-gray-500 hover:bg-gray-50'}`}>Dán Text</button>
                        <button onClick={() => setBatchInputType('excel')} disabled={Object.keys(excelData).length === 0} className={`flex-1 py-1.5 text-sm font-medium rounded transition-all ${batchInputType === 'excel' ? 'bg-blue-100 text-blue-700' : 'text-gray-500 hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed'}`}>Dùng Excel</button>
                    </div>

                    {batchInputType === 'text' ? (
                        <>
                            <textarea value={studentList} onChange={(e) => setStudentList(e.target.value)} className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none resize-none font-mono text-sm leading-relaxed" rows="5" placeholder="Nguyễn Văn A&#10;Trần Thị B | 10A2&#10;Lê Văn C | 10A3 | Học sinh Xuất sắc nhất" />
                            <p className="text-xs text-blue-700 mt-2">Cú pháp: Tên | Lớp | Lý do (Không bắt buộc)</p>
                        </>
                    ) : (
                        <div className="space-y-2">
                            <label className="block text-xs text-gray-600">Chọn lớp muốn xuất (hoặc Tất cả):</label>
                            <select value={selectedExcelClass} onChange={(e) => setSelectedExcelClass(e.target.value)} className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                                <option value="ALL">Tất cả các lớp đã tải ({Object.values(excelData).flat().length} hs)</option>
                                {Object.keys(excelData).map(cls => <option key={cls} value={cls}>Lớp: {cls} ({excelData[cls].length} hs)</option>)}
                            </select>
                        </div>
                    )}

                    <div className="mt-3 pt-3 border-t border-blue-200">
                        <label className="block text-xs font-medium text-gray-700 mb-1">Dòng khen thưởng (Dùng làm mặc định nếu danh sách thiếu)</label>
                        <div className="flex space-x-2 mb-2">
                            <input type="text" value={awardPrefix} onChange={(e) => setAwardPrefix(e.target.value)} className="w-1/3 px-3 py-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Khen tặng em:" />
                            <select value={reason} onChange={(e) => setReason(e.target.value)} className="w-2/3 px-3 py-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                                {predefinedReasons.map((r, i) => <option key={i} value={r}>{r}</option>)}
                            </select>
                        </div>
                        {reason === 'Khác' && (
                            <textarea value={customReason} onChange={(e) => setCustomReason(e.target.value)} className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none resize-none" placeholder="Nhập lý do cụ thể..." rows="2" />
                        )}
                    </div>
                  </div>
                )}

                <div className="border-t pt-4 border-gray-100"></div>

                <div className="grid grid-cols-2 gap-4">
                  <div>
                    <label className="block text-sm font-medium text-gray-700 mb-1">Hoa văn Góc phải</label>
                    <div className="relative">
                      <Trophy className="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 w-4 h-4 pointer-events-none" />
                      <select value={decoration} onChange={(e) => setDecoration(e.target.value)} className="w-full pl-8 pr-2 py-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-white">
                        <option value="none">Trống</option>
                        <option value="medal">Huy chương</option>
                        <option value="trophy">Cúp Vàng</option>
                        <option value="crown">Vương Miện</option>
                        <option value="shield">Khiên Chắn</option>
                        <option value="ribbon_rosette">Ruy Băng</option>
                        <option value="starburst">Ngôi Sao</option>
                        <option value="sun">Mặt Trời</option>
                        <option value="flower">Bông Hoa</option>
                        <option value="book">Sách</option>
                        <option value="diamond">Kim Cương</option>
                      </select>
                    </div>
                  </div>
                  <div>
                    <label className="block text-sm font-medium text-gray-700 mb-1">Vòng Nguyệt Quế</label>
                    <select value={laurelStyle} onChange={(e) => setLaurelStyle(e.target.value)} className="w-full px-2 py-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-white">
                      <option value="none">Không có</option>
                      <option value="classic_gold">Vàng Cổ Điển</option>
                      <option value="royal_emerald">Ngọc Lục Bảo</option>
                      <option value="sapphire_silver">Bạch Kim</option>
                      <option value="autumn_glory">Lá Thu</option>
                      <option value="cherry_blossom">Hoa Anh Đào</option>
                      <option value="celestial_stars">Dải Ngân Hà</option>
                      <option value="victory_wings">Đôi Cánh</option>
                      <option value="olympic_olive">Nhánh Ô-liu</option>
                      <option value="neon_cyber">Neon</option>
                      <option value="rainbow_pride">Cầu Vồng</option>
                    </select>
                  </div>
                </div>

                <div>
                  <label className="block text-sm font-medium text-gray-700 mb-1">Ảnh Logo / Ảnh thẻ dùng chung</label>
                  <label className="flex items-center justify-center w-full px-4 py-3 border-2 border-dashed border-gray-300 rounded-xl cursor-pointer hover:bg-gray-50 hover:border-blue-400 transition-colors group">
                    <div className="flex items-center space-x-2">
                      <ImageIcon className="w-5 h-5 text-gray-400 group-hover:text-blue-500" />
                      <span className="text-sm text-gray-500 group-hover:text-blue-600 truncate">
                        {photoUrl ? 'Đã tải ảnh lên (Nhấn để đổi)' : 'Chọn ảnh từ máy tính'}
                      </span>
                    </div>
                    <input type="file" className="hidden" accept="image/*" onChange={handleImageUpload} />
                  </label>
                </div>

                <button 
                  onClick={handleDownload} 
                  disabled={isGenerating}
                  className={`w-full mt-6 flex items-center justify-center space-x-2 font-medium py-3 px-4 rounded-xl transition-all shadow-md ${isGenerating ? 'bg-gray-400 cursor-not-allowed' : 'bg-blue-600 hover:bg-blue-700 active:scale-[0.98] text-white'}`}
                >
                  {isGenerating ? (
                    <><Loader2 className="w-5 h-5 animate-spin" /><span>Đang xử lý nén file...</span></>
                  ) : (
                    <><Download className="w-5 h-5" /><span>{inputMode === 'single' ? 'Tải Xuống 1 Bản' : 'Tạo & Tải File ZIP Hàng Loạt'}</span></>
                  )}
                </button>
              </div>
            </div>

            {/* PANEL PHẢI: Live Preview */}
            <div className="lg:col-span-8 flex flex-col items-center bg-gray-50 rounded-2xl p-4 lg:p-8 border border-gray-200">
              <div className="w-full flex justify-between items-center mb-4">
                <h2 className="text-lg font-semibold text-gray-700">Xem Trước {inputMode === 'batch' && '(Bản Mẫu)'}</h2>
                <div className="flex items-center space-x-2">
                  {!fontsLoaded && <span className="text-xs text-orange-600 animate-pulse">Đang tải font thư pháp...</span>}
                  <span className="text-sm bg-blue-100 text-blue-800 px-3 py-1 rounded-full font-medium">Độ phân giải in ấn (A4)</span>
                </div>
              </div>
              
              <div className="w-full bg-white shadow-2xl rounded-sm overflow-hidden border-4 border-gray-300 relative group">
                <canvas ref={canvasRef} className="w-full h-auto object-contain" />
                <div className="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center pointer-events-none">
                   <div className="bg-white/90 px-4 py-2 rounded-lg font-medium text-gray-800 shadow-lg flex items-center space-x-2">
                     <Download className="w-4 h-4 text-blue-600" />
                     <span>Nhấn Tải Xuống ở hộp thoại bên trái</span>
                   </div>
                </div>
              </div>
            </div>

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
